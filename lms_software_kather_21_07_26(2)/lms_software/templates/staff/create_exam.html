{% extends "staff/base.html" %}

{% block title %}Create Entrance Exam - Staff Portal{% endblock %}
{% block header_title %}Create Entrance Exam{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 bg-white">
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('staff_exams_create') }}">
                    
                    <div class="mb-4">
                        <label for="title" class="form-label fw-semibold text-muted small">Exam Title</label>
                        <input type="text" class="form-control" id="title" name="title" required placeholder="e.g. Class 10 Entrance Exam">
                    </div>
                    
                    <div class="mb-4">
                        <label for="duration" class="form-label fw-semibold text-muted small">Duration (Minutes)</label>
                        <input type="number" class="form-control" id="duration" name="duration" required min="1" max="180" value="60">
                    </div>
                    
                    <div class="mb-5">
                        <label for="class_id" class="form-label fw-semibold text-muted small">Assign to Class</label>
                        <select class="form-select" id="class_id" name="class_id" required>
                            <option value="" disabled selected>Select a Class</option>
                            {% for c in classrooms %}
                                <option value="{{ c.class_id }}">{{ c.class_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-blue-primary fw-semibold px-4 flex-grow-1">Create Exam</button>
                        <a href="{{ url_for('staff_exams_list') }}" class="btn btn-light fw-semibold px-4 border text-muted">Cancel</a>
                    </div>
                    
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
