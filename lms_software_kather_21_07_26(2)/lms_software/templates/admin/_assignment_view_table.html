<div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light text-muted small"><tr><th class="ps-3 border-0">Subject</th><th class="border-0">Code</th><th class="border-0 pe-3">Assigned Staff</th></tr></thead>
        <tbody>
            {% for assignment in section_assignments %}
            <tr><td class="ps-3 fw-semibold text-dark">{{ assignment.subject.name }}</td><td><span class="badge bg-blue-light text-blue-primary">{{ assignment.subject.code }}</span></td><td class="pe-3">{{ assignment.staff.first_name }} {{ assignment.staff.last_name or '' }}</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
